name: CI

on:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      daily-notes: ${{ steps.filter.outputs.daily-notes }}
      habit-tracker: ${{ steps.filter.outputs.habit-tracker }}
      weather-companion: ${{ steps.filter.outputs.weather-companion }}
      movie-series-browser: ${{ steps.filter.outputs.movie-series-browser }}
      fitness-dashboard: ${{ steps.filter.outputs.fitness-dashboard }}
      smart-home-control: ${{ steps.filter.outputs.smart-home-control }}
      field-service-app: ${{ steps.filter.outputs.field-service-app }}
      streaming-media-platform: ${{ steps.filter.outputs.streaming-media-platform }}
      spatial-collaboration: ${{ steps.filter.outputs.spatial-collaboration }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            daily-notes:
              - '.github/workflows/ci.yml'
              - 'DailyNotes.xcodeproj/**'
              - 'DailyNotes/**'
              - 'DailyNotesTests/**'
              - 'DailyNotesUITests/**'
            habit-tracker:
              - '.github/workflows/ci.yml'
              - 'HabitTracker.xcodeproj/**'
              - 'HabitTracker/**'
              - 'HabitTrackerShared/**'
              - 'HabitTrackerWatch/**'
              - 'HabitTrackerTests/**'
              - 'HabitTrackerUITests/**'
            weather-companion:
              - '.github/workflows/ci.yml'
              - 'WeatherCompanion.xcodeproj/**'
              - 'WeatherCompanion/**'
              - 'WeatherCompanionShared/**'
              - 'WeatherCompanionWatch/**'
              - 'WeatherCompanionWidget/**'
              - 'WeatherCompanionTests/**'
              - 'WeatherCompanionUITests/**'
            movie-series-browser:
              - '.github/workflows/ci.yml'
              - 'MovieSeriesBrowser.xcodeproj/**'
              - 'MovieSeriesBrowser/**'
              - 'MovieSeriesBrowserShared/**'
              - 'MovieSeriesBrowserTV/**'
              - 'MovieSeriesBrowserTests/**'
              - 'MovieSeriesBrowserUITests/**'
            fitness-dashboard:
              - '.github/workflows/ci.yml'
              - 'FitnessDashboard.xcodeproj/**'
              - 'FitnessDashboard/**'
              - 'FitnessDashboardShared/**'
              - 'FitnessDashboardWatch/**'
              - 'FitnessDashboardTests/**'
              - 'FitnessDashboardUITests/**'
            smart-home-control:
              - '.github/workflows/ci.yml'
              - 'SmartHomeControl.xcodeproj/**'
              - 'SmartHomeControl/**'
              - 'SmartHomeControlShared/**'
              - 'SmartHomeControlWatch/**'
              - 'SmartHomeControlTV/**'
              - 'SmartHomeControlTests/**'
              - 'SmartHomeControlUITests/**'
            field-service-app:
              - '.github/workflows/ci.yml'
              - 'FieldServiceApp.xcodeproj/**'
              - 'FieldServiceApp/**'
              - 'FieldServiceAppShared/**'
              - 'FieldServiceAppWatch/**'
              - 'FieldServiceAppTests/**'
              - 'FieldServiceAppUITests/**'
            streaming-media-platform:
              - '.github/workflows/ci.yml'
              - 'StreamingMediaPlatform.xcodeproj/**'
              - 'StreamingMediaPlatform/**'
              - 'StreamingMediaPlatformShared/**'
              - 'StreamingMediaPlatformWatch/**'
              - 'StreamingMediaPlatformTV/**'
              - 'StreamingMediaPlatformTests/**'
              - 'StreamingMediaPlatformUITests/**'
            spatial-collaboration:
              - '.github/workflows/ci.yml'
              - 'SpatialCollaboration.xcodeproj/**'
              - 'SpatialCollaboration/**'
              - 'SpatialCollaborationShared/**'
              - 'SpatialCollaborationVision/**'
              - 'SpatialCollaborationTests/**'
              - 'SpatialCollaborationUITests/**'

  daily-notes:
    needs: changes
    if: needs.changes.outputs.daily-notes == 'true'
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Select Simulator
        run: echo "SIMULATOR_ID=$(xcrun simctl list devices available -j | ruby -rjson -e 'devices = JSON.parse(STDIN.read)["devices"].find { |runtime, _| runtime.end_with?("iOS-26-4") }.last; puts devices.find { |device| device["name"] == "iPhone 17" }.fetch("udid")')" >> "$GITHUB_ENV"
      - name: Test Daily Notes
        run: xcodebuild test -project DailyNotes.xcodeproj -scheme DailyNotes -destination "platform=iOS Simulator,id=$SIMULATOR_ID,arch=arm64" -parallel-testing-enabled NO

  habit-tracker:
    needs: changes
    if: needs.changes.outputs.habit-tracker == 'true'
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Select Simulators
        run: |
          echo "SIMULATOR_ID=$(xcrun simctl list devices available -j | ruby -rjson -e 'devices = JSON.parse(STDIN.read)["devices"].find { |runtime, _| runtime.end_with?("iOS-26-4") }.last; puts devices.find { |device| device["name"] == "iPhone 17" }.fetch("udid")')" >> "$GITHUB_ENV"
          echo "WATCH_SIMULATOR_ID=$(xcrun simctl list devices available -j | ruby -rjson -e 'devices = JSON.parse(STDIN.read)["devices"].find { |runtime, _| runtime.end_with?("watchOS-26-4") }.last; puts devices.find { |device| device["name"] == "Apple Watch Series 11 (46mm)" }.fetch("udid")')" >> "$GITHUB_ENV"
      - name: Test Habit Tracker
        run: xcodebuild test -project HabitTracker.xcodeproj -scheme HabitTracker -destination "platform=iOS Simulator,id=$SIMULATOR_ID,arch=arm64" -parallel-testing-enabled NO
      - name: Build Habit Tracker Watch
        run: xcodebuild build -project HabitTracker.xcodeproj -scheme HabitTrackerWatch -destination "platform=watchOS Simulator,id=$WATCH_SIMULATOR_ID,arch=arm64"

